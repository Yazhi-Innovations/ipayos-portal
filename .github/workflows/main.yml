name: Deploy to iPayOS Portal Prod

on:
  push:
    branches: [ main ]  # or your main branch
  workflow_dispatch:    # allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP Dependencies
        run: |
          composer require spatie/laravel-ignition
          composer require laravel/sail
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install NPM Dependencies and Build
        run: |
          rm -rf public/build
          rm -rf node_modules
          rm -f package-lock.json
          npm install
          npm run build

      - name: Setup Environment
        run: |
          if [ -f ".env.development" ]; then
            cp .env.development .env
          else
            echo "Warning: .env.example not found. Creating empty .env file."
            touch .env
          fi
          php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 755 storage bootstrap/cache

      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PATH_PROD: ${{ secrets.HOSTINGER_PATH_PROD }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="HOSTINGER_HOST "
          [ -z "$PORT" ] && missing="${missing}HOSTINGER_PORT "
          [ -z "$USER" ] && missing="${missing}HOSTINGER_USER "
          [ -z "$PATH_PROD" ] && missing="${missing}HOSTINGER_PATH_PROD "
          [ -z "$SSH_KEY" ] && missing="${missing}SSH_PRIVATE_KEY "
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets: $missing"
            echo "Add them in: Repository Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Adding Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} -o StrictHostKeyChecking=no 'echo "SSH connection successful"'

      - name: Remove workspace .env before SSH steps
        run: rm -f .env

      - name: Deploy to Hostinger
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET: ${{ secrets.HOSTINGER_PATH_PROD }}
          EXCLUDE: "/.git/, /.github/, /node_modules/, /tests/, .env, .env.example, .env.production, .env.development, .gitignore public/uploads"
          ARGS: "-rltgoDzvO --delete --exclude=.env --exclude=public/uploads --exclude=storage/* --exclude=bootstrap/cache/*"

      - name: Post Deployment Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_PATH_PROD }}
            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan migrate --force
